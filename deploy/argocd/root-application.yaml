apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incidentpilot-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:YASHMAHAKAL/incident-pilot.git
    targetRevision: main
    path: deploy/argocd/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
