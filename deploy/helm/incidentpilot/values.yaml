# This file is a portable chart baseline, not a deployment-ready environment.
# Set image references to immutable digests and provide runtime.existingSecret
# outside Git before installing. Repository-specific demo defaults are in
# values-demo.example.yaml.
imagePullPolicy: IfNotPresent

api:
  image: registry.example/incidentpilot-api:REPLACE_ME
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

mcp:
  image: registry.example/incidentpilot-mcp:REPLACE_ME
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

runtime:
  existingSecret: incidentpilot-runtime
  githubSecret: ""
  environment: production
  repository: your-org/your-repository
  remediationPath: deploy/helm/incidentpilot/values.yaml
  otlpEndpoint: http://opentelemetry-collector.incidentpilot-observability.svc.cluster.local:4318
  prometheusURL: http://prometheus.incidentpilot-observability.svc.cluster.local:9090
  lokiURL: http://loki.incidentpilot-observability.svc.cluster.local:3100
  tempoURL: http://tempo.incidentpilot-observability.svc.cluster.local:3200

postgresql:
  enabled: true
  image: postgres:17.11-alpine3.24
  storage: 20Gi
  storageClassName: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}

demoNamespace: incidentpilot-demo

# External mode scopes read-only investigation to existing workloads. Optional
# Kubernetes OOM and image-pull verifiers do not enable remediation.
onboarding:
  mode: demo

demo:
  enabled: true
  image: registry.example/incidentpilot-demo:REPLACE_ME
  trafficImage: registry.example/incidentpilot-traffic:REPLACE_ME
  frontend:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
  orders:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
  payments:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
