# Replace these examples before deployment. The application namespace exists already.
api:
  image: registry.example/incidentpilot-api:REPLACE_ME

mcp:
  image: registry.example/incidentpilot-mcp:REPLACE_ME

demo:
  enabled: false

onboarding:
  mode: external
  namespace: payments
  workloads:
    - name: checkout
      container: checkout
      podLabelKey: app.kubernetes.io/name
      podLabelValue: checkout
    - name: payment-gateway
      container: payment-gateway
      podLabelKey: app.kubernetes.io/name
      podLabelValue: payment-gateway
  alerts:
    - name: CheckoutErrors
      workload: checkout
    - name: PaymentGatewayUnavailable
      workload: payment-gateway
  verifiers:
    - kubernetes_oom
    - image_pull

runtime:
  environment: production
  repository: your-org/your-repository
  remediationPath: deploy/helm/incidentpilot/values.yaml
  lokiURL: https://loki.example.internal
