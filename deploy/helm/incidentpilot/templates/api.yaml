apiVersion: v1
kind: Service
metadata:
  name: incidentpilot-api
  labels:
    app.kubernetes.io/name: incidentpilot-api
    {{- include "incidentpilot.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: incidentpilot-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentpilot-api
  labels:
    app.kubernetes.io/name: incidentpilot-api
    {{- include "incidentpilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: incidentpilot-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incidentpilot-api
        {{- include "incidentpilot.labels" . | nindent 8 }}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- include "incidentpilot.securityContext" . | nindent 12 }}
          env:
            - name: INCIDENTPILOT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.runtime.existingSecret }}, key: database_url}}
            - name: INCIDENTPILOT_WEBHOOK_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.runtime.existingSecret }}, key: webhook_token}}
            - name: INCIDENTPILOT_MCP_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.runtime.existingSecret }}, key: mcp_token}}
            - name: INCIDENTPILOT_REMEDIATION_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.runtime.existingSecret }}, key: remediation_token}}
            - {name: INCIDENTPILOT_MCP_ENDPOINT, value: "http://incidentpilot-mcp.{{ .Release.Namespace }}.svc.cluster.local:8081/mcp"}
            - {name: INCIDENTPILOT_ENVIRONMENT, value: {{ .Values.runtime.environment | quote }}}
            - {name: INCIDENTPILOT_REPOSITORY, value: {{ .Values.runtime.repository | quote }}}
            - {name: INCIDENTPILOT_REMEDIATION_PATH, value: {{ .Values.runtime.remediationPath | quote }}}
            - {name: INCIDENTPILOT_ONBOARDING_PROFILE, value: {{ .Values.onboarding | toJson | quote }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.runtime.otlpEndpoint | quote }}}
          {{- if .Values.runtime.githubSecret }}
          envFrom:
            - secretRef: {name: {{ .Values.runtime.githubSecret }}}
          {{- end }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: incidentpilot-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: incidentpilot-api}
