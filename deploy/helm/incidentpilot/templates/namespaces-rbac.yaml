{{- if eq .Values.onboarding.mode "demo" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.demoNamespace }}
  labels:
    {{- include "incidentpilot.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: incidentpilot-observability
  labels:
    {{- include "incidentpilot.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidentpilot-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incidentpilot.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incidentpilot-reader
  namespace: {{ ternary .Values.demoNamespace .Values.onboarding.namespace (eq .Values.onboarding.mode "demo") }}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log, services]
    verbs: [get]
  {{- if eq .Values.onboarding.mode "demo" }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [orders-config]
    verbs: [get]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incidentpilot-mcp-reader
  namespace: {{ ternary .Values.demoNamespace .Values.onboarding.namespace (eq .Values.onboarding.mode "demo") }}
subjects:
  - kind: ServiceAccount
    name: incidentpilot-mcp
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: incidentpilot-reader
  apiGroup: rbac.authorization.k8s.io
