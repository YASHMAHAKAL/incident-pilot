apiVersion: v1
kind: Service
metadata:
  name: incidentpilot-mcp
  labels:
    app.kubernetes.io/name: incidentpilot-mcp
    {{- include "incidentpilot.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: incidentpilot-mcp}
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentpilot-mcp
  labels:
    app.kubernetes.io/name: incidentpilot-mcp
    {{- include "incidentpilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: incidentpilot-mcp}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incidentpilot-mcp
        {{- include "incidentpilot.labels" . | nindent 8 }}
    spec:
      serviceAccountName: incidentpilot-mcp
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp
          image: {{ .Values.mcp.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- include "incidentpilot.securityContext" . | nindent 12 }}
          env:
            - name: INCIDENTPILOT_MCP_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.runtime.existingSecret }}, key: mcp_token}}
            - name: INCIDENTPILOT_REMEDIATION_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.runtime.existingSecret }}, key: remediation_token}}
            - {name: INCIDENTPILOT_REMEDIATION_ENDPOINT, value: "http://incidentpilot-api.{{ .Release.Namespace }}.svc.cluster.local:8080/api/v1/remediations"}
            - {name: INCIDENTPILOT_ONBOARDING_PROFILE, value: {{ .Values.onboarding | toJson | quote }}}
            - {name: INCIDENTPILOT_PROMETHEUS_URL, value: {{ .Values.runtime.prometheusURL | quote }}}
            - {name: INCIDENTPILOT_LOKI_URL, value: {{ .Values.runtime.lokiURL | quote }}}
            - {name: INCIDENTPILOT_TEMPO_URL, value: {{ .Values.runtime.tempoURL | quote }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.runtime.otlpEndpoint | quote }}}
          ports: [{name: http, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: incidentpilot-mcp
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: incidentpilot-mcp}
