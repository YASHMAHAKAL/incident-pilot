apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: incidentpilot-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include: [/var/log/pods/incidentpilot-demo_*/*/*.log]
        start_at: beginning
        include_file_path: true
        operators:
          - type: container
    processors:
      batch: {}
      resource/logs:
        attributes:
          - key: service.name
            from_attribute: k8s.container.name
            action: upsert
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      otlphttp/tempo:
        endpoint: http://tempo.incidentpilot-observability.svc.cluster.local:4318
      otlphttp/loki:
        endpoint: http://loki.incidentpilot-observability.svc.cluster.local:3100/otlp
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
        logs:
          receivers: [filelog]
          processors: [resource/logs, batch]
          exporters: [otlphttp/loki]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: incidentpilot-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    rule_files:
      - /etc/prometheus/rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager.incidentpilot-system.svc.cluster.local:9093]
    scrape_configs:
      - job_name: incidentpilot-demo
        static_configs:
          - targets: [otel-collector.incidentpilot-observability.svc.cluster.local:8889]
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.incidentpilot-observability.svc.cluster.local:8080]
  rules.yml: |
    groups:
      - name: incidentpilot-demo
        rules:
          - alert: DemoCheckoutErrors
            expr: increase(demo_requests_total{service_name="frontend",role="frontend",outcome="upstream_error"}[30s]) > 2
            for: 10s
            labels:
              namespace: incidentpilot-demo
              service: frontend
              severity: warning
            annotations:
              summary: Demo checkout is failing on upstream calls
          - alert: DemoCheckoutLatency
            expr: sum(increase(demo_request_duration_seconds_sum{service_name="frontend",role="frontend",outcome="success"}[30s])) / sum(increase(demo_request_duration_seconds_count{service_name="frontend",role="frontend",outcome="success"}[30s])) > 0.75
            for: 10s
            labels:
              namespace: incidentpilot-demo
              service: frontend
              severity: warning
            annotations:
              summary: Successful demo checkout latency is elevated
          - alert: DemoImagePullBackOff
            expr: max by (namespace, container) (kube_pod_container_status_waiting_reason{namespace="incidentpilot-demo",container="orders-api",reason=~"ErrImagePull|ImagePullBackOff"}) > 0
            for: 10s
            labels:
              namespace: incidentpilot-demo
              service: orders-api
              severity: warning
            annotations:
              summary: orders-api cannot pull its configured container image
          - alert: DemoInvalidOrderConfig
            expr: max by (namespace, container) (kube_pod_container_status_waiting_reason{namespace="incidentpilot-demo",container="orders-api",reason="CrashLoopBackOff"}) > 0
            for: 10s
            labels:
              namespace: incidentpilot-demo
              service: orders-api
              severity: warning
            annotations:
              summary: orders-api is repeatedly failing during startup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: incidentpilot-observability
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: incidentpilot-observability
data:
  config.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        wal:
          path: /tmp/tempo/wal
        local:
          path: /tmp/tempo/blocks
    usage_report:
      reporting_enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: incidentpilot-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.incidentpilot-observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.incidentpilot-observability.svc.cluster.local:3100
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.incidentpilot-observability.svc.cluster.local:3200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: incidentpilot-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: IncidentPilot
        folder: IncidentPilot
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-incidentpilot-dashboard
  namespace: incidentpilot-observability
data:
  incidentpilot.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {"type":"stat","title":"Alert signals (15m)","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(incidentpilot_alert_signals_total[15m]))","refId":"A"}],"gridPos":{"h":7,"w":6,"x":0,"y":0}},
        {"type":"stat","title":"Investigations (15m)","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(incidentpilot_investigations_total[15m]))","refId":"A"}],"gridPos":{"h":7,"w":6,"x":6,"y":0}},
        {"type":"stat","title":"LLM calls (15m)","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(incidentpilot_llm_requests_total[15m]))","refId":"A"}],"gridPos":{"h":7,"w":6,"x":12,"y":0}},
        {"type":"stat","title":"PRs created (15m)","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(increase(incidentpilot_prs_created_total[15m]))","refId":"A"}],"gridPos":{"h":7,"w":6,"x":18,"y":0}},
        {"type":"timeseries","title":"Investigation duration p95","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(incidentpilot_investigation_duration_seconds_bucket[5m])))","legendFormat":"p95","refId":"A"}],"gridPos":{"h":8,"w":12,"x":0,"y":7}},
        {"type":"timeseries","title":"MCP calls by tool/status","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (tool, status) (rate(incidentpilot_tool_calls_total[5m]))","legendFormat":"{{tool}} {{status}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":12,"y":7}},
        {"type":"timeseries","title":"LLM tokens","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (direction) (rate(incidentpilot_llm_tokens_total[5m]))","legendFormat":"{{direction}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":0,"y":15}},
        {"type":"timeseries","title":"Remediation outcomes","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (status) (rate(incidentpilot_remediation_requests_total[5m]))","legendFormat":"{{status}}","refId":"A"},{"expr":"sum(rate(incidentpilot_policy_denials_total[5m]))","legendFormat":"policy denied","refId":"B"}],"gridPos":{"h":8,"w":12,"x":12,"y":15}}
      ],
      "schemaVersion": 41,
      "tags": ["incidentpilot", "phase-12"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "IncidentPilot control plane",
      "uid": "incidentpilot-control-plane",
      "version": 1
    }
